<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janier Jair Hoyos Anacona — Portafolio</title>
<meta name="description" content="Portafolio de Janier Jair Hoyos Anacona, Tecnólogo en Desarrollo de Software y estudiante de Ingeniería Informática.">
<script>
  (function(){
    var preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', preferred);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --surface-2:#F3F3EF;
    --border:#E4E4DE;
    --text:#181818;
    --text-dim:#6B6E73;
    --accent:#1769E0;
    --accent-2:#4EA1FF;
    --accent-soft:rgba(23,105,224,0.12);
    --shadow:rgba(24,24,20,0.10);
    --nav-bg:rgba(250,250,248,0.9);
    --radius:10px;
    --maxw:1080px;
  }

  :root[data-theme="dark"]{
    --bg:#0B0F14;
    --surface:#121821;
    --surface-2:#161D27;
    --border:#26303C;
    --text:#ECEFF3;
    --text-dim:#8B93A0;
    --accent:#55A7FF;
    --accent-2:#2777D8;
    --accent-soft:rgba(85,167,255,0.14);
    --shadow:rgba(0,0,0,0.55);
    --nav-bg:rgba(11,15,20,0.85);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height:1.65;
    font-size:16px;
    transition:background 0.25s ease, color 0.25s ease;
  }

  h1,h2,h3{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    line-height:1.2;
    margin:0;
    letter-spacing:-0.01em;
  }

  a{color:inherit;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  code{
    font-family:'IBM Plex Mono', monospace;
    background:var(--surface-2);
    padding:2px 6px;
    border-radius:4px;
    font-size:0.85em;
  }

  .skip-link{
    position:absolute; left:-999px; top:0;
    background:var(--accent); color:#06110D; padding:10px 16px;
    border-radius:4px; z-index:100;
  }
  .skip-link:focus{left:16px; top:16px;}

  a:focus-visible, button:focus-visible, label:focus-within{
    outline:2px solid var(--accent);
    outline-offset:3px;
    border-radius:3px;
  }

  /* ---------- Reusable  gradient-border surface ---------- */
  .panel{
    border:1px solid transparent;
    border-radius:var(--radius);
    background-image:
      linear-gradient(var(--surface), var(--surface)),
      linear-gradient(135deg, var(--accent), var(--border) 65%);
    background-origin:border-box;
    background-clip:padding-box, border-box;
    box-shadow:0 18px 40px -28px var(--shadow);
    transition:background 0.25s ease, box-shadow 0.25s ease;
  }

  /* ---------- Nav ---------- */
  .nav{
    position:sticky; top:0; z-index:50;
    background:var(--nav-bg);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    transition:background 0.25s ease, border-color 0.25s ease;
  }
  .nav-inner{
    max-width:var(--maxw); margin:0 auto;
    padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
  }
  .wordmark{
    font-family:'IBM Plex Mono', monospace;
    color:var(--accent);
    text-decoration:none;
    font-size:0.95rem;
  }
  .nav-right{display:flex; align-items:center; gap:18px;}
  .nav-links{display:flex; gap:26px;}
  .nav-links a{
    text-decoration:none;
    color:var(--text-dim);
    font-size:0.9rem;
    transition:color 0.15s ease;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
  }
  .nav-links a:hover{color:var(--text); border-color:var(--text);}
  .nav-toggle{display:none;}

  .theme-toggle{
    width:36px; height:36px; flex-shrink:0;
    border-radius:50%;
    border:1px solid transparent;
    background-image:
      linear-gradient(var(--surface), var(--surface)),
      linear-gradient(135deg, var(--accent), var(--border) 70%);
    background-origin:border-box;
    background-clip:padding-box, border-box;
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform 0.2s ease;
  }
  .theme-toggle:hover{transform:rotate(12deg);}
  .theme-toggle svg{width:18px; height:18px;}
  .theme-toggle .icon-moon{display:none;}
  [data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  [data-theme="dark"] .theme-toggle .icon-moon{display:block;}

  @media (max-width:700px){
    .nav-links{
      position:fixed; inset:64px 0 auto 0;
      background:var(--surface);
      flex-direction:column;
      padding:20px 24px;
      gap:18px;
      border-bottom:1px solid var(--border);
      transform:translateY(-120%);
      transition:transform 0.25s ease;
    }
    .nav-links.open{transform:translateY(0);}
    .nav-toggle{
      display:block;
      background:none; border:1px solid var(--border);
      color:var(--text); border-radius:6px;
      padding:6px 12px; font-family:'IBM Plex Mono', monospace;
      font-size:0.85rem;
      cursor:pointer;
    }
  }

  /* ---------- Layout helpers ---------- */
  .section{
    max-width:var(--maxw); margin:0 auto;
    padding:88px 24px;
    border-bottom:1px solid var(--border);
    border-image:linear-gradient(to right, transparent, var(--border) 50%, transparent) 1;
  }
  .section:last-of-type{border:none;}
  .section.alt{
    background:var(--surface-2); max-width:none;
    border-bottom:1px solid var(--border);
    border-image:linear-gradient(to right, transparent, var(--border) 50%, transparent) 1;
    transition:background 0.25s ease;
  }
  .section.alt > *{max-width:var(--maxw); margin-left:auto; margin-right:auto;}
  .section > h2{
    font-size:clamp(1.5rem, 2.2vw, 1.9rem);
    margin-bottom:40px;
  }

  /* ---------- Hero ---------- */
  .hero{
    max-width:var(--maxw); margin:0 auto; padding:80px 24px 96px;
    opacity:0; animation:heroIn 0.7s ease forwards;
  }
  @keyframes heroIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .hero-grid{
    display:grid;
    grid-template-columns:1.2fr 0.8fr;
    gap:56px;
    align-items:start;
  }
  @media (max-width:860px){
    .hero-grid{grid-template-columns:1fr; gap:40px;}
  }
  .hero-role{
    font-size:1.05rem;
    color:var(--text-dim);
    max-width:46ch;
    margin-bottom:6px;
  }
  .hero-role strong{color:var(--text); font-weight:500;}
  .hero-aspiration{
    font-family:'IBM Plex Mono', monospace;
    color:var(--accent);
    font-size:0.92rem;
    margin-bottom:34px;
    margin-top:14px;
  }
  .hero-ctas{display:flex; gap:14px; flex-wrap:wrap;}
  .btn{
    display:inline-block;
    padding:12px 22px;
    border-radius:var(--radius);
    text-decoration:none;
    font-size:0.92rem;
    font-weight:500;
    transition:opacity 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    cursor:pointer;
  }
  .btn-primary{
    background-image:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#06120D;
    border:none;
    box-shadow:0 12px 24px -12px var(--accent);
  }
  .btn-primary:hover{opacity:0.92; transform:translateY(-1px);}
  .btn-secondary{
    border:1px solid transparent;
    background-image:
      linear-gradient(var(--bg), var(--bg)),
      linear-gradient(135deg, var(--accent), var(--border) 70%);
    background-origin:border-box;
    background-clip:padding-box, border-box;
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.86rem;
  }
  .btn-secondary:hover{color:var(--accent);}

  /* ---------- Avatar (foto de perfil) ---------- */
  .avatar-row{display:flex; align-items:center; gap:20px; margin-bottom:26px;}
  .avatar-ring{
    width:112px; height:112px; flex-shrink:0;
    border-radius:50%;
    padding:3px;
    background-image:linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .avatar-slot{
    position:relative;
    width:100%; height:100%;
    border-radius:50%;
    background:var(--surface-2);
    overflow:hidden;
  }
  .avatar-slot img{width:100%; height:100%; object-fit:cover; display:block;}
  .avatar-slot.empty img{display:none;}
  .avatar-placeholder{
    display:none; position:absolute; inset:0;
    align-items:center; justify-content:center;
    color:var(--text-dim);
  }
  .avatar-slot.empty .avatar-placeholder{display:flex;}
  .avatar-edit{
    position:absolute; right:0; bottom:0;
    width:30px; height:30px; border-radius:50%;
    background-image:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#06120D;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:2px solid var(--bg);
  }
  .avatar-edit svg{width:14px; height:14px;}
  .avatar-copy p{margin:0; font-size:0.82rem; color:var(--text-dim); font-family:'IBM Plex Mono', monospace;}

  h1.hero-name{
    font-size:clamp(2rem, 4.6vw, 2.9rem);
    margin-bottom:18px;
  }

  /* ---------- Fact sheet (hero right column) ---------- */
  .factsheet{padding:0;}
  .factsheet dl{margin:0;}
  .factsheet .row{
    display:flex; justify-content:space-between; gap:16px;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    font-size:0.9rem;
  }
  .factsheet .row:last-child{border-bottom:none;}
  .factsheet dt{
    font-family:'IBM Plex Mono', monospace;
    color:var(--text-dim); font-size:0.8rem;
    flex-shrink:0;
  }
  .factsheet dd{margin:0; text-align:right;}
  .factsheet a{text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:3px;}
  .factsheet a:hover{text-decoration-color:var(--accent); color:var(--accent);}

  /* ---------- Perfil ---------- */
  .perfil-grid{
    display:grid;
    grid-template-columns:1.3fr 0.9fr;
    gap:48px;
  }
  @media (max-width:760px){.perfil-grid{grid-template-columns:1fr;}}
  .perfil-grid p{color:var(--text-dim); max-width:62ch; font-size:1.02rem;}
  blockquote{
    margin:0;
    padding:22px 24px;
    border-left:2px solid transparent;
    border-image:linear-gradient(180deg, var(--accent), var(--accent-2)) 1;
    font-size:1.05rem;
    font-style:italic;
    color:var(--text);
  }
  blockquote span{
    display:block; margin-top:12px;
    font-family:'IBM Plex Mono', monospace;
    font-style:normal; font-size:0.78rem; color:var(--text-dim);
  }

  /* ---------- Habilidades ---------- */
  .skills-columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
  }
  @media (max-width:760px){.skills-columns{grid-template-columns:1fr;}}
  .skill-group h3{
    font-size:0.85rem; font-weight:500;
    color:var(--text-dim);
    margin-bottom:18px;
    font-family:'IBM Plex Mono', monospace;
    text-transform:lowercase;
  }
  .tag-grid{display:flex; flex-wrap:wrap; gap:10px;}
  .tag{
    padding:7px 14px;
    border-radius:20px;
    border:1px solid transparent;
    font-size:0.85rem;
    color:var(--text);
    background-image:
      linear-gradient(var(--surface), var(--surface)),
      linear-gradient(120deg, var(--border), var(--border));
    background-origin:border-box;
    background-clip:padding-box, border-box;
  }
  .tag.solid{
    color:var(--accent);
    background-image:
      linear-gradient(var(--surface), var(--surface)),
      linear-gradient(120deg, var(--accent), var(--accent-2));
  }
  .tag.growth{
    color:var(--text-dim);
    background-image:
      linear-gradient(var(--surface), var(--surface)),
      linear-gradient(120deg, var(--text-dim), var(--border) 75%);
  }

  /* ---------- Proyecto ---------- */
  .project-panel{ padding:36px; }
  @media (max-width:600px){.project-panel{padding:24px;}}
  .project-header{
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:8px; margin-bottom:16px;
  }
  .project-header h3{font-size:1.35rem;}
  .project-tag{
    font-family:'IBM Plex Mono', monospace;
    color:var(--text-dim); font-size:0.8rem;
  }
  .project-panel > p{color:var(--text-dim); max-width:68ch;}
  .project-stat{
    display:inline-flex; align-items:baseline; gap:8px;
    margin:20px 0 22px;
    padding:12px 18px;
    background-image:linear-gradient(120deg, var(--accent-soft), transparent);
    border-radius:var(--radius);
  }
  .project-stat b{font-family:'Space Grotesk', sans-serif; font-size:1.4rem; color:var(--accent);}
  .project-stat span{color:var(--text-dim); font-size:0.85rem;}

  /* ---------- Evidencias ---------- */
  .evidence-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:28px;
  }
  @media (max-width:760px){.evidence-grid{grid-template-columns:1fr;}}
  .evidence-card{
    padding:22px;
    display:flex; flex-direction:column; gap:14px;
  }
  .evidence-card h3{font-size:1.1rem;}
  .evidence-desc{ margin:0; color:var(--text-dim); font-size:0.92rem; }
  .evidence-slot{
    position:relative;
    aspect-ratio:4/3;
    min-height:200px;
    border-radius:var(--radius);
    background:var(--surface-2);
    border:1px dashed var(--border);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .evidence-slot .file-icon{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    text-align:center;
    padding:16px;
  }
  .evidence-slot .file-icon svg{
    width:48px;
    height:48px;
    opacity:0.6;
  }
  .evidence-slot img{width:100%; height:100%; object-fit:cover; display:block;}
  .evidence-slot.empty img{display:none;}
  .evidence-slot .file-icon{display:none;}
  .evidence-slot.empty .file-icon{display:flex;}
  
  /* Estilos para el video en evidencias */
  .evidence-slot video{
    width:100%; 
    height:100%; 
    object-fit:cover;
    display:block;
  }
  .evidence-slot .download-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border-radius:var(--radius);
    text-decoration:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    transition:opacity 0.15s ease;
  }
  .evidence-slot .download-link:hover{
    opacity:0.85;
  }
  .evidence-slot .pptx-preview{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
  }
  .evidence-slot .pptx-preview svg{
    width:64px;
    height:64px;
    color:var(--accent);
  }
  
  .evidence-controls{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .upload-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 16px;
    border:1px solid transparent;
    border-radius:var(--radius);
    font-size:0.84rem;
    font-family:'IBM Plex Mono', monospace;
    cursor:pointer;
    background-image:
      linear-gradient(var(--surface), var(--surface)),
      linear-gradient(120deg, var(--accent), var(--border) 70%);
    background-origin:border-box;
    background-clip:padding-box, border-box;
    transition:color 0.15s ease;
  }
  .upload-btn:hover{color:var(--accent);}
  .evidence-hint{margin:0; font-size:0.76rem; color:var(--text-dim);}
  .evidence-note{margin:0; font-size:0.78rem; color:var(--accent); min-height:1.1em;}

  /* ---------- Formación ---------- */
  .timeline{list-style:none; margin:0; padding:0; max-width:640px;}
  .timeline li{
    position:relative;
    padding:0 0 36px 30px;
    border-left:1px solid transparent;
    border-image:linear-gradient(180deg, var(--accent), var(--border) 80%) 1;
  }
  .timeline li:last-child{border-color:transparent; border-image:none; padding-bottom:0;}
  .timeline li::before{
    content:'';
    position:absolute; left:-5px; top:4px;
    width:9px; height:9px; border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border);
  }
  .timeline li.current::before{background-image:linear-gradient(135deg, var(--accent), var(--accent-2)); border-color:var(--accent);}
  .timeline-year{
    font-family:'IBM Plex Mono', monospace;
    color:var(--text-dim); font-size:0.8rem;
  }
  .timeline li h3{margin:6px 0 4px; font-size:1.08rem;}
  .timeline li p{margin:0; color:var(--text-dim); font-size:0.92rem;}

  /* ---------- Proyección ---------- */
  .goals{list-style:none; margin:0; padding:0; display:grid; gap:0;}
  .goals li{
    display:flex; gap:18px; align-items:flex-start;
    padding:22px 0;
    border-bottom:1px solid var(--border);
    border-image:linear-gradient(to right, var(--border), transparent 85%) 1;
  }
  .goals li:last-child{border:none;}
  .goals li .glyph{
    font-family:'IBM Plex Mono', monospace;
    color:var(--accent);
    flex-shrink:0;
    font-size:0.85rem;
    padding-top:2px;
  }
  .goals li p{margin:0; color:var(--text-dim);}

  /* ---------- Contacto ---------- */
  .contact-grid{ display:flex; flex-wrap:wrap; gap:14px; }
  .contact-card{
    display:flex; align-items:center; gap:12px;
    padding:16px 20px;
    text-decoration:none;
    color:var(--text);
    flex:1 1 220px;
    transition:transform 0.15s ease;
  }
  .contact-card:hover{transform:translateY(-2px);}
  .contact-card svg{flex-shrink:0; color:var(--accent);}
  .contact-card .label{
    display:block; font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem; color:var(--text-dim); margin-bottom:2px;
  }

  footer{
    max-width:var(--maxw); margin:0 auto;
    padding:32px 24px 60px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- Motion / professional interactions ---------- */
  html{scroll-behavior:smooth; scroll-padding-top:82px;}
  body{overflow-x:hidden;}

  /* Barra de progreso de desplazamiento */
  body::before{
    content:'';
    position:fixed;
    z-index:1000;
    top:0; left:0;
    width:var(--scroll-progress,0%);
    height:3px;
    background:linear-gradient(90deg,#1769E0,#4EA1FF,#8BC7FF);
    box-shadow:0 0 14px rgba(23,105,224,.7);
    pointer-events:none;
    transition:width .08s linear;
  }

  .hero{
    animation:heroIn .9s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes heroIn{
    from{opacity:0;transform:translateY(28px) scale(.985)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* Aparición progresiva al entrar en pantalla */
  .reveal{
    opacity:0;
    transform:translateY(34px);
    transition:
      opacity .75s cubic-bezier(.22,1,.36,1),
      transform .75s cubic-bezier(.22,1,.36,1);
    will-change:opacity,transform;
  }
  .reveal.visible{opacity:1;transform:translateY(0);}
  .reveal-delay-1{transition-delay:.08s}
  .reveal-delay-2{transition-delay:.16s}
  .reveal-delay-3{transition-delay:.24s}

  /* Títulos: subrayado único y animado */
  .section > h2{
    position:relative;
    display:block;
    width:max-content;
    padding-bottom:13px;
    margin:0 0 40px 0;
  }
  .section > h2::after{
    content:'';
    position:absolute;
    left:0;
    bottom:0;
    width:54px;
    height:4px;
    border-radius:999px;
    background:var(--title-accent,var(--accent));
    box-shadow:0 0 12px color-mix(in srgb,var(--title-accent,var(--accent)) 35%,transparent);
    transform-origin:left;
    transform:scaleX(.45);
    transition:width .45s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1),box-shadow .3s ease;
  }
  .section > h2:hover::after{width:100%;transform:scaleX(1);box-shadow:0 0 18px color-mix(in srgb,var(--title-accent,var(--accent)) 45%,transparent);}
  #perfil{--title-accent:#8B5CF6}
  #habilidades{--title-accent:#0EA5E9}
  #proyecto{--title-accent:#2563EB}
  #evidencias{--title-accent:#06B6D4}
  #formacion{--title-accent:#14B8A6}
  #proyeccion{--title-accent:#F59E0B}
  #contacto{--title-accent:#EC4899}

  /* Hover más visible en azul: tarjetas, botones, etiquetas y controles */
  .panel{
    position:relative;
    overflow:hidden;
    transition:
      transform .35s cubic-bezier(.22,1,.36,1),
      box-shadow .35s ease,
      border-color .35s ease,
      background .35s ease;
  }
  .panel::before{
    content:'';
    position:absolute;
    inset:-2px;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(78,161,255,.09),transparent 30%);
    opacity:0;
    transition:opacity .35s ease;
    pointer-events:none;
  }
  .panel:hover{
    transform:translateY(-7px);
    box-shadow:0 22px 46px -24px rgba(23,105,224,.34),0 0 0 1px rgba(78,161,255,.12);
    border-color:rgba(78,161,255,.24);
  }
  .panel:hover::before{opacity:1;}

  .btn{
    position:relative;
    overflow:hidden;
    transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s ease,filter .28s ease;
  }
  .btn::after{
    content:'';
    position:absolute;
    top:-80%;
    left:-120%;
    width:70%;
    height:260%;
    transform:rotate(20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
    transition:left .6s ease;
    pointer-events:none;
  }
  .btn:hover{transform:translateY(-3px);filter:saturate(1.12);box-shadow:0 14px 28px -14px rgba(23,105,224,.65);}
  .btn:hover::after{left:150%;}

  .nav-links a{
    position:relative;
    transition:color .25s ease,transform .25s ease;
  }
  .nav-links a::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-4px;
    height:2px;
    border-radius:99px;
    background:linear-gradient(90deg,#1769E0,#4EA1FF);
    transform:scaleX(0);
    transform-origin:center;
    transition:transform .3s cubic-bezier(.22,1,.36,1);
  }
  .nav-links a:hover{transform:translateY(-1px);}
  .nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);}
  .nav-links a.active{color:var(--text);}

  .tag{
    transition:transform .25s cubic-bezier(.22,1,.36,1),border-color .25s ease,box-shadow .25s ease;
  }
  .tag:hover{
    transform:translateY(-3px);
    border-color:rgba(78,161,255,.55);
    box-shadow:0 8px 18px -12px rgba(23,105,224,.7);
  }

  .avatar-ring{
    transition:transform .45s cubic-bezier(.22,1,.36,1),filter .45s ease;
  }
  .avatar-ring:hover{transform:translateY(-4px) rotate(1deg) scale(1.025);filter:drop-shadow(0 10px 18px rgba(23,105,224,.28));}

  .timeline li{transition:transform .3s ease;}
  .timeline li:hover{transform:translateX(5px);}
  .timeline li:hover::before{box-shadow:0 0 0 5px rgba(78,161,255,.13);}

  .goals li{
    transition:transform .3s ease,padding-left .3s ease;
  }
  .goals li:hover{transform:translateX(6px);padding-left:8px;}
  .goals li:hover .glyph{color:#4EA1FF;}

  .contact-card{transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s ease;}
  .contact-card:hover{transform:translateY(-5px);}

  /* Evita movimientos excesivos si el usuario los desactiva */
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none;}
    .panel:hover,.btn:hover,.avatar-ring:hover,.goals li:hover,.contact-card:hover{transform:none;}
  }

</style>
